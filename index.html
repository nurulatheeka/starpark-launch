<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <title>Starpark_AI Launch</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    #10182b 0%,
                    #05070d 55%,
                    #020308 100%
                );

            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .box {
            width: 86%;
            max-width: 420px;
            padding: 36px 24px;
        }

        h1 {
            font-size: 30px;
            letter-spacing: 2px;
            margin: 0 0 8px;
        }

        .subtitle {
            opacity: 0.65;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .loader {
            width: 46px;
            height: 46px;

            margin: 32px auto;

            border: 4px solid rgba(255,255,255,0.12);
            border-top-color: white;
            border-radius: 50%;

            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #status {
            opacity: 0.75;
            line-height: 1.5;
        }

        #fallback {
            display: none;
            margin-top: 28px;
        }

        #manualLink {
            display: inline-block;

            padding: 15px 22px;

            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 14px;

            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>FUTURA MERDEKA</h1>

        <div class="subtitle">
            STARpark_AI CEREMONIAL LAUNCH
        </div>

        <div class="loader"></div>

        <div id="status">
            Connecting to Starpark_AI...
        </div>

        <div id="fallback">

            <p>
                Connection is taking longer than expected.
            </p>

            <a
                id="manualLink"
                href="#"
            >
                CONTINUE TO STARPARK_AI
            </a>

        </div>

    </div>


    <script>

        async function connectToStarpark() {

            const status =
                document.getElementById("status");

            const fallback =
                document.getElementById("fallback");

            const manualLink =
                document.getElementById("manualLink");


            try {

                /*
                    Cache-buster supaya Safari sentiasa
                    ambil tunnel URL terbaru.
                */

                const response = await fetch(
                    "tunnel.txt?t=" + Date.now(),
                    {
                        cache: "no-store"
                    }
                );


                if (!response.ok) {
                    throw new Error(
                        "Unable to read tunnel URL"
                    );
                }


                const tunnelURL =
                    (await response.text()).trim();


                if (
                    !tunnelURL.startsWith("https://")
                ) {
                    throw new Error(
                        "Invalid tunnel URL"
                    );
                }


                manualLink.href =
                    tunnelURL;


                status.innerText =
                    "Starpark_AI found. Connecting...";


                /*
                    Small delay supaya visitor nampak
                    cinematic connecting screen.
                */

                setTimeout(() => {

                    window.location.href =
                        tunnelURL;

                }, 700);


                /*
                    Kalau Safari tak redirect,
                    manual button akan muncul.
                */

                setTimeout(() => {

                    fallback.style.display =
                        "block";

                }, 4500);


            } catch (error) {

                console.log(error);

                status.innerText =
                    "Unable to connect automatically.";

                fallback.style.display =
                    "block";
            }

        }


        connectToStarpark();

    </script>

</body>
</html>
